name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (e.g. new push to a PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deployment is not done here. The Vercel project is connected straight to this
# repository, so Vercel builds and deploys every push itself — production from
# main, a preview from every pull request. Driving it from here as well would
# mean a second build, a Vercel token stored as a repository secret, and a run
# that reports red whenever those credentials drift, all for a deploy that has
# already happened.
#
# What is left is the check Vercel cannot give us early enough to be useful: a
# build that runs before the deploy does, so a broken push fails here rather
# than halfway through going live.

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Lint issues are reported but must not block a deploy.
        continue-on-error: true
        run: pnpm lint

      - name: Check page content
        run: pnpm check:content

      - name: Build
        # No environment variables needed: every one the app reads has a
        # fallback, and the real values live in the Vercel project.
        run: pnpm build
