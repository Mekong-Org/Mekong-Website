name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (e.g. new push to a PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deployment goes through the Vercel CLI rather than Vercel's Git integration.
# That integration cannot read a private repository inside a GitHub org without
# a Vercel Pro plan; here the runner checks the code out itself and hands Vercel
# a finished build, so the plan never comes into it.
#
# One secret, VERCEL_TOKEN. `vercel link --yes` creates the project on its first
# run and reuses it afterwards, so there is no org id or project id to copy out
# of a dashboard and keep in step. Anything the app reads from the environment
# belongs in the Vercel project's own settings — one place, not two.
#
# The name is given explicitly. Left to itself the CLI names the project after
# the checkout directory, which is "Mekong-Website", and Vercel rejects capitals
# in a project name.

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Lint issues are reported but must not block a deploy.
        continue-on-error: true
        run: pnpm lint

      - name: Check page content
        run: pnpm check:content

      - name: Build
        # Runs without any environment variables: every one the app reads has a
        # fallback. This is the check that still works when the Vercel
        # credentials are missing or stale, which is when it matters most.
        run: pnpm build

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        run: |
          npx --yes vercel@latest link \
            --yes --project mekong-website --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy \
            --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: |
          npx --yes vercel@latest link \
            --yes --project mekong-website --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy \
            --prod --yes --token="$VERCEL_TOKEN")
          echo "Production URL: $url"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
